# Prüft wöchentlich, ob es neuere Versionen der gepinnten Actions gibt,
# und schlägt die Aktualisierung als Pull Request vor (Commit-SHA plus Versions-Kommentar).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "Actions"
